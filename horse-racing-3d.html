<!DOCTYPE html>

<body>

</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

//=========================================================================
// COSTANTI — stesse unità del gioco originale (javascript-racer)
//=========================================================================
const SEGMENT_LENGTH = 200;
const RUMBLE_LENGTH  = 3;
const ROAD_WIDTH     = 2000;          // semilarghezza: playerX = ±1 è il bordo strada
const MAX_SPEED      = 12000;         // unità/secondo (= segmentLength/(1/60))
const ACCEL          =  MAX_SPEED/5;
const BRAKING        = -MAX_SPEED;
const DECEL          = -MAX_SPEED/5;
const OFFROAD_DECEL  = -MAX_SPEED/2;
const OFFROAD_LIMIT  =  MAX_SPEED/4;
const CENTRIFUGAL    = 0.3;

// Conversione pseudo-3D → 3D reale:
const CURVE_K = 0.0038;               // radianti di sterzata per unità di "curve" per segmento
const Y_SCALE = 0.6;                  // smorza le colline (nel finto 3D erano esagerate dalla proiezione)

const HORSE_HEIGHT = 1300;            // altezza cavallo in unità mondo (≈ 1 corsia)
const SKY_COLOR    = 0x72D7EE;

//=========================================================================
// TRACCIATO — porting fedele di addRoad/resetRoad dal gioco originale
//=========================================================================
const easeIn    = (a,b,p) => a + (b-a)*Math.pow(p,2);
const easeInOut = (a,b,p) => a + (b-a)*((-Math.cos(p*Math.PI)/2) + 0.5);

const segments = [];
const lastY = () => segments.length === 0 ? 0 : segments[segments.length-1].p2y;

function addSegment(curve, y) {
  segments.push({ index: segments.length, p1y: lastY(), p2y: y, curve });
}
function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY();
  const endY   = startY + ((y|0) * SEGMENT_LENGTH);
  const total  = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n/enter),            easeInOut(startY, endY, n/total));
  for (let n = 0; n < hold;  n++) addSegment(curve,                                easeInOut(startY, endY, (enter+n)/total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n/leave),         easeInOut(startY, endY, (enter+hold+n)/total));
}

const ROAD = {
  LENGTH: { NONE:0, SHORT:25, MEDIUM:50, LONG:100 },
  HILL:   { NONE:0, LOW:20, MEDIUM:40, HIGH:60 },
  CURVE:  { NONE:0, EASY:2, MEDIUM:4, HARD:6 }
};
const addStraight = (n=ROAD.LENGTH.MEDIUM)                                    => addRoad(n,n,n, 0, 0);
const addHill     = (n=ROAD.LENGTH.MEDIUM, h=ROAD.HILL.MEDIUM)                => addRoad(n,n,n, 0, h);
const addCurve    = (n=ROAD.LENGTH.MEDIUM, c=ROAD.CURVE.MEDIUM, h=ROAD.HILL.NONE) => addRoad(n,n,n, c, h);
function addLowRollingHills(n=ROAD.LENGTH.SHORT, h=ROAD.HILL.LOW) {
  addRoad(n,n,n,  0,  h/2);
  addRoad(n,n,n,  0, -h);
  addRoad(n,n,n,  ROAD.CURVE.EASY,  h);
  addRoad(n,n,n,  0,  0);
  addRoad(n,n,n, -ROAD.CURVE.EASY,  h/2);
  addRoad(n,n,n,  0,  0);
}
function addSCurves() {
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY,    ROAD.HILL.NONE);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  ROAD.CURVE.MEDIUM,  ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM,  ROAD.CURVE.EASY,   -ROAD.HILL.LOW);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.EASY,    ROAD.HILL.MEDIUM);
  addRoad(ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, ROAD.LENGTH.MEDIUM, -ROAD.CURVE.MEDIUM, -ROAD.HILL.MEDIUM);
}
function addBumps() {
  for (const y of [5,-2,-5,8,5,-7,5,-2]) addRoad(10,10,10, 0, y);
}
function addDownhillToEnd(n=200) {
  addRoad(n,n,n, -ROAD.CURVE.EASY, -lastY()/SEGMENT_LENGTH);
}

// layout del livello 1 (identico a resetRoad del gioco attuale)
addStraight(ROAD.LENGTH.SHORT);
addLowRollingHills();
addSCurves();
addCurve(ROAD.LENGTH.MEDIUM, ROAD.CURVE.MEDIUM, ROAD.HILL.LOW);
addBumps();
addLowRollingHills();
addCurve(ROAD.LENGTH.LONG*2, ROAD.CURVE.MEDIUM, ROAD.HILL.MEDIUM);
addStraight();
addHill(ROAD.LENGTH.MEDIUM, ROAD.HILL.HIGH);
addSCurves();
addCurve(ROAD.LENGTH.LONG, -ROAD.CURVE.MEDIUM, ROAD.HILL.NONE);
addHill(ROAD.LENGTH.LONG, ROAD.HILL.HIGH);
addCurve(ROAD.LENGTH.LONG, ROAD.CURVE.MEDIUM, -ROAD.HILL.LOW);
addBumps();
addHill(ROAD.LENGTH.LONG, -ROAD.HILL.MEDIUM);
addStraight();
addSCurves();
addDownhillToEnd();

const N = segments.length;
const TRACK_LENGTH = N * SEGMENT_LENGTH;

//=========================================================================
// CENTERLINE 3D — qui le curve diventano VERE: integriamo "curve" in un
// angolo di direzione e costruiamo i punti x,y,z nello spazio
//=========================================================================
const pts = [];
{
  let x = 0, z = 0, heading = 0;
  for (const s of segments) {
    pts.push({ x, y: s.p1y * Y_SCALE, z, heading });
    heading -= s.curve * CURVE_K;       // curve positiva = curva a destra, come nell'originale
    x += Math.sin(heading) * SEGMENT_LENGTH;
    z += Math.cos(heading) * SEGMENT_LENGTH;
  }
  pts.push({ x, y: segments[N-1].p2y * Y_SCALE, z, heading });
}

// (posizione lungo pista, offset laterale normalizzato) → punto nel mondo
function posToWorld(position, lateralN, out, lookahead) {
  position = ((position % TRACK_LENGTH) + TRACK_LENGTH) % TRACK_LENGTH;
  const i = Math.floor(position / SEGMENT_LENGTH);
  const t = (position % SEGMENT_LENGTH) / SEGMENT_LENGTH;
  const a = pts[i], b = pts[i+1];
  const h = a.heading + (b.heading - a.heading) * t;
  const rx = -Math.cos(h), rz = Math.sin(h);   // destra di chi guarda lungo (sin h, cos h)
  out.x = a.x + (b.x-a.x)*t + rx * lateralN * ROAD_WIDTH;
  out.y = a.y + (b.y-a.y)*t;
  out.z = a.z + (b.z-a.z)*t + rz * lateralN * ROAD_WIDTH;
  if (lookahead) lookahead.heading = h;
  return out;
}
const curveAt = (position) => {
  position = ((position % TRACK_LENGTH) + TRACK_LENGTH) % TRACK_LENGTH;
  return segments[Math.floor(position / SEGMENT_LENGTH) % N].curve;
};

//=========================================================================
// SCENA
//=========================================================================
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // resa cinematografica (S-curve)
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;     // ombre morbide

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 80, 600000);

// CIELO ATMOSFERICO vero (Rayleigh/Mie scattering), non più un colore piatto
const sky = new Sky();
sky.scale.setScalar(450000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value        = 9;
skyU.rayleigh.value         = 2.6;     // cielo più ricco, orizzonte caldo
skyU.mieCoefficient.value   = 0.006;
skyU.mieDirectionalG.value  = 0.92;    // alone del sole più marcato

// direzione del sole (elevazione/azimut) → usata da cielo, luce e ombre
const sunDir = new THREE.Vector3();
{
  const elevation = 17, azimuth = 165;  // tardo pomeriggio dorato, sole frontale-laterale
  const phi = THREE.MathUtils.degToRad(90 - elevation);
  const theta = THREE.MathUtils.degToRad(azimuth);
  sunDir.setFromSphericalCoords(1, phi, theta);
  skyU.sunPosition.value.copy(sunDir);
}

// nebbia tinta come l'orizzonte caldo, così la pista lontana si fonde nel cielo
scene.fog = new THREE.Fog(0xe7d8bf, 26000, 150000);

// luce ambientale dal cielo/terra + sole direzionale caldo che proietta ombre morbide
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x6a5436, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffdca6, 3.0);
sun.position.copy(sunDir).multiplyScalar(20000);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SHADOW_R = 7000;                                 // mezzo lato dell'area ombreggiata attorno al giocatore
const sc = sun.shadow.camera;
sc.left = -SHADOW_R; sc.right = SHADOW_R; sc.top = SHADOW_R; sc.bottom = -SHADOW_R;
sc.near = 2000; sc.far = 60000;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 40;
scene.add(sun, sun.target);

// POST-PROCESSING: bloom dorato sulle alte luci (sole, riga di partenza, riflessi)
// pipeline moderna: RenderPass (HDR lineare) → bloom → OutputPass (tone map + sRGB)
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(
  innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 }   // 4× MSAA dentro al composer
));
composer.addPass(new RenderPass(scene, camera));
// strength contenuta + soglia alta: solo le ALTE LUCI HDR (sole, cielo, riga via) fioriscono, non i mezzitoni
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.22, 0.3, 1.1);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

//=========================================================================
// GEOMETRIA PISTA — nastri (ribbon) con vertex colors
//=========================================================================
const COL = {
  ROAD_L:   new THREE.Color(0x737373), ROAD_D:   new THREE.Color(0x616161),
  GRASS_L:  new THREE.Color(0x4f9e3a), GRASS_D:  new THREE.Color(0x438c30),   // strisce morbide, verde naturale
  RUMBLE_L: new THREE.Color(0x555555), RUMBLE_D: new THREE.Color(0xBBBBBB),
  LANE:     new THREE.Color(0xCCCCCC),
  START:    new THREE.Color(0xFFFFFF), FINISH:   new THREE.Color(0x101010),
};
const isDark = i => Math.floor(i/RUMBLE_LENGTH) % 2 === 1;

// texture PBR CC0 (ambientCG): Color+Normal+Roughness, ripetute nello spazio mondo
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function loadPBR(base) {
  const tl = new THREE.TextureLoader();
  const map = tl.load(base + '_Color.jpg');
  const normalMap = tl.load(base + '_NormalGL.jpg');
  const roughnessMap = tl.load(base + '_Roughness.jpg');
  map.colorSpace = THREE.SRGBColorSpace;
  for (const t of [map, normalMap, roughnessMap]) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = maxAniso;
  }
  return { map, normalMap, roughnessMap };
}
const asphaltTex = loadPBR('assets/textures/Asphalt014/Asphalt014_1K-JPG');
const grassTex   = loadPBR('assets/textures/Grass004/Grass004_1K-JPG');

// coda di pista piatta prima del via, così dietro la partenza non c'è il vuoto
const PRE = 25;
const ext = [];
for (let i = PRE; i > 0; i--) ext.push({ x: 0, y: pts[0].y, z: -i * SEGMENT_LENGTH, heading: 0 });
ext.push(...pts);

// nastro generico lungo la pista; colorOf(i) → THREE.Color o null per saltare il
// segmento. I nastri NON si sovrappongono mai (niente z-fighting a distanza);
// le linee di corsia sono decal con polygonOffset.
function buildRibbon({ half, yOff = 0, centerOff = 0, colorOf, decal = false, flatOuter = false, roughness = 1, tex = null, uvTile = 2000 }) {
  const positions = [], colors = [], uvs = [];
  // flatOuter=true: bordo esterno (lontano dalla strada) scende a y=0, evita soffitti verdi sui saliscendi
  const sideSign = Math.sign(centerOff);
  const edge = (p, off) => {
    const rx = -Math.cos(p.heading), rz = Math.sin(p.heading);
    let y;
    if (flatOuter) {
      const t = (sideSign * off + half) / (2 * half);  // 0=bordo interno, 1=bordo esterno
      y = (p.y + yOff) * (1 - t);
    } else {
      y = p.y + yOff;
    }
    return [ p.x + rx*(centerOff+off), y, p.z + rz*(centerOff+off) ];
  };
  // UV planari nel frame della pista (laterale L, longitudinale D), tile in unità mondo:
  // continue tra nastri adiacenti e lungo la lunghezza → tiling senza stiramenti
  const uL = (centerOff - half)/uvTile, uR = (centerOff + half)/uvTile;
  for (let i = 0; i < ext.length - 1; i++) {
    const c = colorOf(i - PRE);
    if (!c) continue;
    const a = ext[i], b = ext[i+1];
    const al = edge(a,-half), ar = edge(a,half), bl = edge(b,-half), br = edge(b,half);
    positions.push(...al, ...ar, ...br,  ...al, ...br, ...bl);
    for (let k = 0; k < 6; k++) colors.push(c.r, c.g, c.b);
    const vA = (i*SEGMENT_LENGTH)/uvTile, vB = ((i+1)*SEGMENT_LENGTH)/uvTile;
    uvs.push(uL,vA, uR,vA, uR,vB,  uL,vA, uR,vB, uL,vB);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(colors, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  g.computeVertexNormals();
  const matOpts = { vertexColors: true, roughness, metalness: 0 };
  if (tex) Object.assign(matOpts, tex);
  const mat = new THREE.MeshStandardMaterial(matOpts);
  if (decal) {
    mat.polygonOffset = true;
    mat.polygonOffsetFactor = -4;
    mat.polygonOffsetUnits = -4;
    mat.depthWrite = false;
  }
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = !decal;
  scene.add(m);
  return m;
}

const RUMBLE_W   = ROAD_WIDTH * 0.24;
const GRASS_HALF = ROAD_WIDTH * 6;     // nastro erboso modesto; oltre c'è il fondale piatto

// fondale erboso: piano enorme e STATICO (texture world-locked, niente swimming) che
// riempie l'orizzonte fino alla nebbia senza generare triangoli-scheggia
const GROUND_SIZE = 1500000, GROUND_TILE = 3500;
const groundGrass = {
  map: grassTex.map.clone(), normalMap: grassTex.normalMap.clone(), roughnessMap: grassTex.roughnessMap.clone(),
};
for (const k in groundGrass) {
  const t = groundGrass[k];
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(GROUND_SIZE/GROUND_TILE, GROUND_SIZE/GROUND_TILE);
  t.needsUpdate = true;
}
groundGrass.map.colorSpace = THREE.SRGBColorSpace;
const groundPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE),
  new THREE.MeshStandardMaterial({ color: 0xc8d0b0, roughness: 1, metalness: 0, ...groundGrass })
);
groundPlane.rotation.x = -Math.PI/2;
groundPlane.position.y = -40;
groundPlane.renderOrder = -1;
groundPlane.receiveShadow = true;
scene.add(groundPlane);
const rumbleCol = i => isDark(i) ? COL.RUMBLE_D : COL.RUMBLE_L;
// con le texture i vertex-color fanno solo da modulazione (valori anche >1, gestiti dal tone mapping)
const roadPre   = new THREE.Color(0.78,0.78,0.78);
const roadBase  = new THREE.Color(0.92,0.92,0.92);
const roadStart = new THREE.Color(2.6,2.6,2.6);     // riga di partenza chiara
const roadFin   = new THREE.Color(0.05,0.05,0.05);  // traguardo scuro
const grassA    = new THREE.Color(1,1,1);
const grassB    = new THREE.Color(0.93,0.97,0.9);   // striscia tenue per il senso di velocità

buildRibbon({ half: ROAD_WIDTH, roughness: 1, tex: asphaltTex, uvTile: 1300, colorOf: i => {
  if (i < 0)              return roadPre;
  if (i === 2 || i === 3) return roadStart;
  if (i >= N - RUMBLE_LENGTH) return roadFin;
  return roadBase;
}});
for (const side of [-1, 1]) {
  buildRibbon({ half: RUMBLE_W/2,  centerOff: side*(ROAD_WIDTH + RUMBLE_W/2),            colorOf: rumbleCol });
  buildRibbon({ half: GRASS_HALF,  centerOff: side*(ROAD_WIDTH + RUMBLE_W + GRASS_HALF),
               colorOf: i => isDark(i) ? grassB : grassA, tex: grassTex, uvTile: 3500, flatOuter: true });
}
// linee di corsia tratteggiate (3 corsie come nell'originale) — decal sopra l'asfalto
for (const off of [-ROAD_WIDTH/3, ROAD_WIDTH/3])
  buildRibbon({ half: ROAD_WIDTH*0.015, yOff: 2, centerOff: off*2, decal: true,
                colorOf: i => (i >= 0 && !isDark(i)) ? COL.LANE : null });

//=========================================================================
// ALBERI — vero 3D di contorno (instanced, ~500 alberi). Esposto pulse() per
// il "party mode" a tempo: rimbalzano ingrandendosi in modo elastico/comico.
//=========================================================================
const trees = (() => {
  const spots = [];
  for (let i = 8; i < N; i += 6) {
    for (const side of [-1, 1]) {
      if (Math.random() < 0.32) continue;
      // mai dentro l'escursione laterale del giocatore (playerX max ±2.2)
      spots.push({ i, lat: side * (2.8 + Math.random()*4.0), s: 0.65 + Math.random()*1.05,
                   yaw: Math.random()*Math.PI*2, hue: 0.30 + Math.random()*0.08,
                   light: 0.24 + Math.random()*0.16 });
    }
  }
  // abete a due chiome: tronco + cono basso largo + cono alto stretto
  const trunkG = new THREE.CylinderGeometry(55, 95, 620, 6);
  const lowG   = new THREE.ConeGeometry(640, 1250, 9);
  const topG   = new THREE.ConeGeometry(440, 1450, 9);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5e4128, roughness: 0.95 });
  const leafMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 }); // tinta per-istanza
  const trunk = new THREE.InstancedMesh(trunkG, trunkMat, spots.length);
  const low   = new THREE.InstancedMesh(lowG,   leafMat,  spots.length);
  const top   = new THREE.InstancedMesh(topG,   leafMat,  spots.length);
  for (const m of [trunk, low, top]) { m.castShadow = true; m.receiveShadow = true; }
  const M = new THREE.Matrix4(), P = new THREE.Vector3(), S = new THREE.Vector3(),
        up = new THREE.Vector3(0,1,0), tint = new THREE.Color();
  const data = [];                                   // base per-istanza, per il pulse
  spots.forEach((sp, k) => {
    posToWorld(sp.i * SEGMENT_LENGTH, sp.lat, P);
    const q = new THREE.Quaternion().setFromAxisAngle(up, sp.yaw + (Math.random()-0.5)*0.3);
    data.push({ x: P.x, y: P.y, z: P.z, s: sp.s, q, phase: Math.random() });
    tint.setHSL(sp.hue, 0.55, sp.light);
    low.setColorAt(k, tint); top.setColorAt(k, tint);
  });
  scene.add(trunk, low, top);
  const OFF = { trunk: 310, low: 1245, top: 1770 };  // centri verticali (×scala) delle 3 parti
  // sxzMul/syMul: moltiplicatori di scala (1 = normale). I conetti crescono dalla base.
  function pulse(sxzMul, syMul) {
    for (let k = 0; k < data.length; k++) {
      const d = data[k];
      S.set(d.s*sxzMul, d.s*syMul, d.s*sxzMul);
      P.set(d.x, d.y + OFF.trunk*d.s*syMul, d.z); M.compose(P, d.q, S); trunk.setMatrixAt(k, M);
      P.set(d.x, d.y + OFF.low  *d.s*syMul, d.z); M.compose(P, d.q, S); low.setMatrixAt(k, M);
      P.set(d.x, d.y + OFF.top  *d.s*syMul, d.z); M.compose(P, d.q, S); top.setMatrixAt(k, M);
    }
    trunk.instanceMatrix.needsUpdate = low.instanceMatrix.needsUpdate = top.instanceMatrix.needsUpdate = true;
  }
  pulse(1, 1);                                       // posa iniziale a riposo
  return { pulse };
})();

let modelTemplate = null, modelClip = null, modelClips = [], MODEL_YAW = 0;

// LOCOMOZIONE realistica: andature legate alla velocità (niente "pattinamento" dei piedi),
// inclinazione in curva, imbardata in sterzata, beccheggio in accelerazione/frenata
const GALLOP_STRIDE = HORSE_HEIGHT * 4.0;   // unità mondo percorse in un ciclo di galoppo
const WALK_STRIDE   = HORSE_HEIGHT * 1.8;
const BANK_K  = 0.06;                        // rollio in curva (per unità di curve × velocità)
const BANK_MAX = 0.32;
const STEER_K = 0.9;                         // quanto il cavallo "punta" verso dove sterza
const PITCH_K = 0.18;                        // beccheggio su accel/frenata
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };

class HorseActor {
  constructor(tintHex = 0xffffff) {
    this.tint = new THREE.Color(tintHex);
    this.group = new THREE.Group();
    scene.add(this.group);

    // ombra
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(HORSE_HEIGHT*1.1, HORSE_HEIGHT*0.6),
      new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
    sh.rotation.x = -Math.PI/2; sh.position.y = 8;
    this.group.add(sh);
    this.blob = sh;

    // opzione A — billboard
    this.spriteMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.4, color: this.tint, side: THREE.DoubleSide });
    this.billboard = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.spriteMat);
    this.group.add(this.billboard);
    this.frame = 0; this.frameClock = 0;

    // opzione B — montata quando il GLB arriva
    this.model = null; this.mixer = null;
    this.heading = 0; this.bank = 0; this.steerYaw = 0; this.pitch = 0;
    this.actGallop = this.actWalk = this.actIdle = null;
    this.w = { idle: 1, walk: 0, gallop: 0 };   // pesi andature smussati (parte da fermo)
    this.setMode('sprite');
  }
  initSprite() {
    const h = HORSE_HEIGHT, w = h * spriteAspect;
    this.billboard.scale.set(w, h, 1);
    this.billboard.position.y = h/2;
    this.spriteMat.map = frames[0]; this.spriteMat.needsUpdate = true;
  }
  initModel() {
    if (!modelTemplate || this.model) return;
    this.model = SkeletonUtils.clone(modelTemplate);
    this.model.updateWorldMatrix(true, true);
    // dimensione REALE renderizzata: per i modelli skinnati il box della geometria
    // ignora la scala dell'armatura (qui ×100) → misurare dalle ossa dello scheletro
    let skinned = null;
    this.model.traverse(o => { if (o.isSkinnedMesh && !skinned) skinned = o; });
    const box = new THREE.Box3();
    if (skinned && skinned.skeleton && skinned.skeleton.bones.length) {
      const v = new THREE.Vector3();
      for (const b of skinned.skeleton.bones) { b.getWorldPosition(v); box.expandByPoint(v); }
    } else {
      box.setFromObject(this.model);                     // Horse.glb (morph): box geometrico ok
    }
    const s = HORSE_HEIGHT / ((box.max.y - box.min.y) || 1);
    this.model.scale.setScalar(s);
    this.model.position.y = -box.min.y * s;
    this.model.rotation.order = 'YXZ';     // imbardata attorno al su-mondo, poi beccheggio/rollio locali
    this.model.traverse(o => {
      if (o.isMesh) { o.material = o.material.clone(); o.material.color.multiply(this.tint); o.castShadow = true; }
    });
    this.mixer = new THREE.AnimationMixer(this.model);
    const byName = re => modelClips.find(a => re.test(a.name));
    const cG = byName(/gallop|run|canter/i) || modelClip;     // tollerante ai nomi-clip del tuo modello
    let   cW = byName(/walk|trot/i);  if (cW === cG) cW = null;
    let   cI = byName(/idle|stand/i); if (cI === cG) cI = null;
    this.durG = cG.duration || 0.6;  this.durW = (cW && cW.duration) || 1;
    this.actGallop = this.mixer.clipAction(cG); this.actGallop.play();
    if (cW) { this.actWalk = this.mixer.clipAction(cW); this.actWalk.play(); }
    if (cI) { this.actIdle = this.mixer.clipAction(cI); this.actIdle.play(); }
    this.group.add(this.model);
    this.model.visible = (this.mode === 'model');
  }
  setMode(mode) {
    this.mode = mode;
    this.billboard.visible = (mode === 'sprite');
    this.blob.visible = (mode === 'sprite');   // ombra finta solo per sprite; il modello proietta ombra vera
    if (this.model) this.model.visible = (mode === 'model');
  }
  place(position, lateralN) {
    const la = {};
    posToWorld(position, lateralN, this.group.position, la);
    this.heading = la.heading;
  }
  update(dt, speedPct) {
    if (this.mode === 'sprite') {
      const fps = 10 + speedPct * 20;
      this.frameClock += dt * fps;
      if (this.frameClock >= 1 && frames.length === 8) {
        this.frame = (this.frame + Math.floor(this.frameClock)) % 8;
        this.frameClock %= 1;
        this.spriteMat.map = frames[this.frame];
      }
      // billboard cilindrico: ruota verso la camera restando in piedi
      this.billboard.rotation.y = Math.atan2(camera.position.x - this.group.position.x,
                                             camera.position.z - this.group.position.z);
    } else if (this.model) {
      // assetto: imbardata pista + sterzo, rollio in curva, beccheggio
      this.model.rotation.y = this.heading + MODEL_YAW + this.steerYaw;
      this.model.rotation.z = this.bank;
      this.model.rotation.x = this.pitch;
      if (this.mixer) {
        // pesi andatura per velocità (idle→walk→gallop) con transizione morbida
        const gW = smooth(0.22, 0.55, speedPct);
        const wW = (1 - gW) * smooth(0.02, 0.16, speedPct);
        const iW = (1 - gW) - wW;
        const k = 1 - Math.pow(0.0001, dt);
        this.w.gallop += (gW - this.w.gallop) * k;
        this.w.walk   += (wW - this.w.walk)   * k;
        this.w.idle   += (iW - this.w.idle)   * k;
        this.actGallop.setEffectiveWeight(this.w.gallop);
        if (this.actWalk) this.actWalk.setEffectiveWeight(this.w.walk);
        if (this.actIdle) this.actIdle.setEffectiveWeight(this.w.idle);
        // passi sincronizzati alla velocità al suolo → i piedi non "pattinano"
        const sp = speedPct * MAX_SPEED;
        this.actGallop.timeScale = (sp / GALLOP_STRIDE) * this.durG;
        if (this.actWalk) this.actWalk.timeScale = (sp / WALK_STRIDE) * this.durW;
        this.mixer.update(dt);
      }
    }
  }
}

//=========================================================================
// FISICA — porting 1:1 dell'update() originale (posizione + offset laterale)
//=========================================================================
const limit  = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const accel  = (v, a, dt) => v + a*dt;

let position = 0, speed = 0, playerX = 0;
let currentLapTime = 0, lastLapTime = null, started = false;
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
const keyLeft   = () => keys['arrowleft']  || keys['a'];
const keyRight  = () => keys['arrowright'] || keys['d'];
const keyFaster = () => keys['arrowup']    || keys['w'];
const keySlower = () => keys['arrowdown']  || keys['s'];

function updatePhysics(dt) {
  const speedPct = speed / MAX_SPEED;
  const dx = dt * 2 * speedPct;

  if (keyLeft())  playerX -= dx;
  if (keyRight()) playerX += dx;
  playerX -= dx * speedPct * curveAt(position) * CENTRIFUGAL;   // forza centrifuga vera quanto prima

  if      (keyFaster()) speed = accel(speed, ACCEL, dt);
  else if (keySlower()) speed = accel(speed, BRAKING, dt);
  else                  speed = accel(speed, DECEL, dt);

  if ((playerX < -1 || playerX > 1) && speed > OFFROAD_LIMIT)
    speed = accel(speed, OFFROAD_DECEL, dt);

  playerX = limit(playerX, -2.2, 2.2);
  speed   = limit(speed, 0, MAX_SPEED);

  const prev = position;
  position += speed * dt;
  if (speed > 0) started = true;
  if (started) currentLapTime += dt;
  if (position >= TRACK_LENGTH) {            // traguardo (per ora punto-a-punto con wrap)
    position -= TRACK_LENGTH;
    lastLapTime = currentLapTime;
    currentLapTime = 0;
  }

  for (const o of opponents) {
    o.pos += o.speed * dt;
    if (o.pos >= TRACK_LENGTH) o.pos -= TRACK_LENGTH;
  }
}

//=========================================================================
// CAMERE — il motivo per cui si fa il 3D vero
//=========================================================================
const CAM_MODES = ['chase', 'onboard', 'tv', 'orbit'];
let camMode = 0, orbitAngle = 0;
const tvPos = new THREE.Vector3(); let tvAnchor = -1;
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

function updateCamera(dt) {
  const p = player.group.position;
  const h = player.heading;
  const fwd = tmpA.set(Math.sin(h), 0, Math.cos(h));

  // in prima persona il cavallo del giocatore non si deve vedere da dentro
  player.group.visible = CAM_MODES[camMode] !== 'onboard';

  switch (CAM_MODES[camMode]) {
    case 'chase': {
      tmpB.copy(p).addScaledVector(fwd, -2300); tmpB.y += 1150;
      camera.position.lerp(tmpB, 1 - Math.pow(0.0001, dt));
      tmpB.copy(p).addScaledVector(fwd, 1500); tmpB.y += 600;
      camera.lookAt(tmpB);
      break;
    }
    case 'onboard': {
      tmpB.copy(p).addScaledVector(fwd, 500); tmpB.y += 1000;
      camera.position.copy(tmpB);
      tmpB.copy(p).addScaledVector(fwd, 4500); tmpB.y += 550;
      camera.lookAt(tmpB);
      break;
    }
    case 'tv': {
      // postazione fissa a bordo pista; salta avanti quando il giocatore la supera
      if (tvAnchor < 0 || camera.position.distanceTo(p) > 10000 &&
          ((position - tvAnchor + TRACK_LENGTH) % TRACK_LENGTH) < TRACK_LENGTH/2) {
        tvAnchor = (position + 5500) % TRACK_LENGTH;
        posToWorld(tvAnchor, (Math.random() < 0.5 ? -1 : 1) * 1.9, tvPos);
        tvPos.y += 1600;
      }
      camera.position.copy(tvPos);
      tmpB.copy(p); tmpB.y += 700;
      camera.lookAt(tmpB);
      break;
    }
    case 'orbit': {
      orbitAngle += dt * 0.45;
      camera.position.set(p.x + Math.sin(orbitAngle)*3800, p.y + 1900, p.z + Math.cos(orbitAngle)*3800);
      tmpB.copy(p); tmpB.y += 650;
      camera.lookAt(tmpB);
      break;
    }
  }
}

// POLVERE sotto gli zoccoli — pool di sprite che si gonfiano e svaniscono
//=========================================================================
const dust = (() => {
  const tex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32,32,0, 32,32,32);
    grad.addColorStop(0,   'rgba(255,255,255,0.9)');
    grad.addColorStop(0.45,'rgba(255,255,255,0.32)');
    grad.addColorStop(1,   'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  })();
  const POOL = 56, puffs = [];
  for (let i = 0; i < POOL; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: 0xcdb892,
      transparent: true, opacity: 0, depthWrite: false }));
    s.visible = false; scene.add(s);
    puffs.push({ s, age: 0, life: 1, vx: 0, vy: 0, vz: 0, size0: 0 });
  }
  let cursor = 0, emitClock = 0;
  function emit(x, y, z) {
    const p = puffs[cursor]; cursor = (cursor + 1) % POOL;
    p.age = 0; p.life = 0.55 + Math.random()*0.45;
    p.s.position.set(x + (Math.random()-0.5)*340, y + 60, z + (Math.random()-0.5)*340);
    p.vx = (Math.random()-0.5)*500; p.vy = 240 + Math.random()*320; p.vz = (Math.random()-0.5)*500;
    p.size0 = 520 + Math.random()*420; p.s.visible = true;
  }
  function update(dt, fx, fy, fz, speedPct, moving) {
    if (moving && speedPct > 0.12) {
      emitClock += dt;
      const interval = 0.028 / (0.3 + speedPct);   // più veloce = più polvere
      while (emitClock > interval) { emitClock -= interval; emit(fx, fy, fz); }
    }
    for (const p of puffs) {
      if (!p.s.visible) continue;
      p.age += dt;
      const t = p.age / p.life;
      if (t >= 1) { p.s.visible = false; continue; }
      p.s.position.x += p.vx*dt; p.s.position.y += p.vy*dt; p.s.position.z += p.vz*dt;
      p.vy -= 240*dt;                               // gravità leggera
      const sz = p.size0 * (0.6 + t*1.7);
      p.s.scale.set(sz, sz, 1);
      p.s.material.opacity = 0.5 * (1-t) * (1-t);
    }
  }
  return { update };
})();

//=========================================================================
// PARTY MODE a tempo — TAP TEMPO che fa rimbalzare alberi e luce in modo comico
//=========================================================================
const party = (() => {
  const SUN_I = sun.intensity, HEMI_I = hemi.intensity, EXPO = renderer.toneMappingExposure, BLOOM = bloom.strength;
  let on = false, bpm = 120, period = 0.5, nextBeat = 0;
  let s = 0, v = 0, taps = [];          // s,v = molla (offset elastico); taps = tempi dei tap
  let gain = 6;                          // intensità (1 = base; 6 ≈ +500%), regolata dallo slider
  const $i = document.getElementById('party-info');
  function setHud() { if ($i) $i.textContent = on ? `🎉 ${bpm} BPM` : 'spento'; }
  function kick() { s = 1; v = 0; }      // SCATTO a pieno sul beat (poi la molla lo riporta giù con rimbalzo)
  function tap() {
    const now = performance.now()/1000;
    if (taps.length && now - taps[taps.length-1] > 2) taps = [];   // pausa lunga = nuova battuta
    taps.push(now); if (taps.length > 6) taps.shift();
    if (taps.length >= 2) {
      let sum = 0; for (let i = 1; i < taps.length; i++) sum += taps[i]-taps[i-1];
      bpm = Math.max(40, Math.min(240, Math.round(60 / (sum/(taps.length-1)))));
      period = 60/bpm;
    }
    on = true; nextBeat = now + period; kick(); setHud();
  }
  function toggle() { on = !on; if (on) nextBeat = performance.now()/1000 + period; setHud(); }
  function update(dt) {
    const now = performance.now()/1000;
    if (on) while (now >= nextBeat) { nextBeat += period; kick(); }
    const h = Math.min(dt, 0.033);       // molla sotto-critica che riporta lo scatto a 0 con rimbalzo
    v += (-55*s - 9*v) * h; s += v * h;
    if (!on && Math.abs(s) < 1e-4 && Math.abs(v) < 1e-4) return;    // a riposo: nessun lavoro extra
    // DISTORSIONE alberi: scala piena con l'intensità (effetto molto marcato)
    const ts = (s >= 0 ? s : s*0.45) * gain;   // sbilancia verso l'INGRANDIMENTO
    trees.pulse(Math.min(20, Math.max(0.12, 1 + ts*0.6)),
                Math.min(20, Math.max(0.12, 1 + ts*1.1)));          // squash&stretch comico
    // LUCE: curva più dolce + tetti, così lampeggia forte senza sbiancare tutto
    const ls = (s >= 0 ? s : s*0.6) * gain;
    sun.intensity  = SUN_I  * Math.min(3.2, Math.max(0.1, 1 + ls*0.18));
    hemi.intensity = HEMI_I * Math.min(2.6, Math.max(0.1, 1 + ls*0.14));
    renderer.toneMappingExposure = EXPO * Math.min(1.6, Math.max(0.45, 1 + ls*0.05));
    bloom.strength = Math.min(2.0, BLOOM * (1 + Math.max(0, s*gain)*0.9));
  }
  return { tap, toggle, update, setGain(g) { gain = g; } };
})();

//=========================================================================
// LOOP — fixed timestep + interpolazione (moto identico e fluido a 60/120/144Hz)
//=========================================================================
const FIXED_DT = 1/120;                 // passo fisico fisso
let acc = 0, last = performance.now();
let prevPosition = 0, prevPlayerX = 0, prevSpeed = 0;  // stato precedente per interpolare/derivare

// interpola una posizione lungo pista gestendo il wrap al traguardo
function interpWrap(prev, cur, alpha) {
  let d = cur - prev;
  if (d < -TRACK_LENGTH/2) d += TRACK_LENGTH;        // ha superato il traguardo
  else if (d > TRACK_LENGTH/2) d -= TRACK_LENGTH;
  return prev + d * alpha;                            // posToWorld applica il modulo
}

function frame(now) {
  requestAnimationFrame(frame);
  let frameDt = (now - last)/1000;
  last = now;
  if (frameDt > 0.25) frameDt = 0.25;                // dopo un tab in background non rincorrere

  // avanza la fisica a passi fissi; accumula il tempo reale trascorso
  acc += frameDt;
  while (acc >= FIXED_DT) {
    prevPosition = position;
    prevPlayerX  = playerX;
    for (const o of opponents) o.prevPos = o.pos ?? o.prevPos;
    updatePhysics(FIXED_DT);
    acc -= FIXED_DT;
  }
  const alpha = acc / FIXED_DT;                        // frazione tra stato precedente e corrente

  const kk = 1 - Math.pow(0.0005, frameDt);   // smussatura assetto, framerate-independent
  const sp = speed / MAX_SPEED;

  // rendering interpolato: cavalli posizionati tra i due ultimi stati fisici
  player.place(interpWrap(prevPosition, position, alpha),
               prevPlayerX + (playerX - prevPlayerX) * alpha);
  // assetto realistico del giocatore: rollio in curva, imbardata verso lo sterzo, beccheggio
  {
    const bankTarget  = limit(-curveAt(position) * sp * BANK_K, -BANK_MAX, BANK_MAX);
    const latRate     = (playerX - prevPlayerX) / FIXED_DT;            // unità playerX/sec
    const steerTarget = Math.atan2(latRate * ROAD_WIDTH, Math.max(speed, 1)) * STEER_K;
    const accel       = (speed - prevSpeed) / Math.max(frameDt, 1e-3);
    const pitchTarget = limit(-accel / MAX_SPEED * PITCH_K, -0.12, 0.12);
    player.bank     += (bankTarget  - player.bank)     * kk;
    player.steerYaw += (steerTarget - player.steerYaw) * kk;
    player.pitch    += (pitchTarget - player.pitch)    * kk;
  }
  player.update(frameDt, sp);                         // animazioni avanzano col tempo reale
  prevSpeed = speed;
  // polvere ai piedi del giocatore, un po' dietro lungo la direzione di marcia
  {
    const pp = player.group.position, ph = player.heading;
    dust.update(frameDt, pp.x - Math.sin(ph)*300, pp.y, pp.z - Math.cos(ph)*300, sp, speed > 0);
  }
  for (const o of opponents) {
    o.actor.place(interpWrap(o.prevPos ?? o.pos, o.pos, alpha), o.lat);
    const ob = limit(-curveAt(o.pos) * (o.speed/MAX_SPEED) * BANK_K, -BANK_MAX, BANK_MAX);
    o.actor.bank += (ob - o.actor.bank) * kk;
    o.actor.update(frameDt, o.speed/MAX_SPEED);
  }
  party.update(frameDt);                 // party mode: alberi e luce a tempo

  updateCamera(frameDt);
  // FOV dinamico: si allarga con la velocità → forte senso di velocità
  const fovTarget = 66 + (speed/MAX_SPEED) * 16;
  camera.fov += (fovTarget - camera.fov) * (1 - Math.pow(0.02, frameDt));
  camera.updateProjectionMatrix();
  // sole + frustum d'ombra seguono il giocatore: ombre sempre nitide attorno a lui
  sun.target.position.copy(player.group.position);
  sun.position.copy(player.group.position).addScaledVector(sunDir, 20000);
  composer.render();

  $('speed').textContent   = Math.round(speed/60);
  $('laptime').textContent = currentLapTime.toFixed(1);
  $('lastlap').textContent = lastLapTime ? lastLapTime.toFixed(1)+'s' : '—';
}

const isFile = location.protocol === 'file:';
const serverHint = 'apri <b>http://127.0.0.1:8901/horse-racing-3d.html</b> ' +
  '(se il server non è attivo: <code>python3 -m http.server 8901 --bind 127.0.0.1</code> ' +
  'nella cartella del progetto, oppure <code>node server.js</code> e poi ' +
  '<b>https://localhost:3000/horse-racing-3d.html</b>)';

function showWarning(html) {
  const w = document.createElement('div');
  w.className = 'panel';
  w.style.cssText = 'top:60px; left:50%; transform:translateX(-50%); max-width:640px; font-size:14px; background:rgba(140,80,0,.75); cursor:pointer;';
  w.innerHTML = html + '<br><small>(clicca per chiudere)</small>';
  w.onclick = () => w.remove();
  document.body.appendChild(w);
}

Promise.all([framesReady, modelReady]).then(([sOK, mOK]) => {
  if (!sOK && !mOK) {
    $('loading').innerHTML = '<div class="err">' + (isFile
      ? 'Pagina aperta con doppio click (<code>file://</code>): il browser blocca sia gli sprite locali sia il modello. Per favore ' + serverHint + '.'
      : 'Né gli sprite (<code>images/horses/</code>) né il modello 3D (CDN) si sono caricati. Controlla che il server serva la cartella del progetto e che ci sia connessione internet, poi ricarica. In alternativa ' + serverHint + '.') + '</div>';
    return;
  }
  if (sOK) {
    allActors.forEach(a => a.initSprite());
  } else {
    $('btn-sprite').disabled = true;
    showWarning((isFile
      ? 'Pagina aperta con doppio click (<code>file://</code>): gli sprite locali non si caricano così — per il confronto A/B ' + serverHint + '.'
      : 'Sprite non trovati in <code>images/horses/</code> su questo server.') +
      '<br>Per ora parto con l\'<b>Opzione B (modello 3D)</b>.');
  }
  if (!mOK) $('btn-model').disabled = true;
  setMode(sOK ? 'sprite' : 'model');
  $('loading').remove();
  player.place(0, 0);
  requestAnimationFrame(frame);
});
</script>
